name: mago-ski verify

description: >-
  Verifies Skills found under the policy's skill_dirs against certificates
  from approvers your organization's root trusts, for their exact current bytes.
  On pull requests, the policy, trust root and revocation list are read from
  the protected base revision, so a pull request cannot change who is trusted.

branding:
  icon: shield
  color: blue

inputs:
  policy:
    description: Policy file, relative to the repository root.
    required: false
    default: .mago-ski/policy.json

runs:
  using: composite
  steps:
    - name: Check the runner platform
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "::error title=mago-ski::Windows runners are not supported yet (no POSIX executable bit). Use ubuntu or macos runners."
        exit 2

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.23.4

    # The base checkout goes to a path inside the workspace, which holds the pull request. Whatever the pull request put
    # at that path (a folder, or a link that would send the checkout somewhere else) is removed first.
    - name: Clear the base checkout path
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- "${GITHUB_WORKSPACE:?}/.mago-ski-base"

    - name: Check out the protected base revision
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.base.sha }}
        path: .mago-ski-base
        fetch-depth: 1
        persist-credentials: false

    - name: Verify Skill certificates
      shell: bash
      env:
        MAGO_POLICY: ${{ inputs.policy }}
        MAGO_EVENT: ${{ github.event_name }}
        MAGO_ACTION_PATH: ${{ github.action_path }}
        MAGO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        policy_root="$GITHUB_WORKSPACE"
        if [[ "$MAGO_EVENT" == pull_request || "$MAGO_EVENT" == pull_request_target ]]; then
          policy_root="$GITHUB_WORKSPACE/.mago-ski-base"
          # Trust must come from the base revision itself: a real folder at that path, checked out at the base commit.
          if [[ -L "$policy_root" || ! -d "$policy_root" || -L "$policy_root/.git" ]]; then
            echo "::error title=mago-ski::the base checkout at .mago-ski-base is not a real folder"
            exit 2
          fi
          if [[ "$(git -C "$policy_root" rev-parse HEAD)" != "$MAGO_BASE_SHA" ]]; then
            echo "::error title=mago-ski::the base checkout at .mago-ski-base is not at the base revision"
            exit 2
          fi
        fi
        # The verifier runs from this action's own checkout (pinned by the caller's `uses:` ref),
        # never from code in the repository under review.
        node "$MAGO_ACTION_PATH/hosts/github/run.ts" "$policy_root" "$GITHUB_WORKSPACE" "$MAGO_POLICY"
