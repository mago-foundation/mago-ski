name: mago-ski verify

description: >-
  Verifies that every Skill in the repository carries a certificate from an
  approver your organization's root trusts, for its exact current bytes.
  On pull requests, the policy, trust root and revocation list are read from
  the protected base revision, so a pull request cannot change who is trusted.

branding:
  icon: shield
  color: blue

inputs:
  policy:
    description: Policy file, relative to the repository root.
    required: false
    default: .mago-ski/policy.json

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.18.0

    - name: Check out the protected base revision
      if: github.event_name == 'pull_request'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.base.sha }}
        path: .mago-ski-base
        fetch-depth: 1
        persist-credentials: false

    - name: Verify Skill certificates
      shell: bash
      env:
        MAGO_POLICY: ${{ inputs.policy }}
        MAGO_EVENT: ${{ github.event_name }}
        MAGO_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        policy_root="$GITHUB_WORKSPACE"
        if [[ "$MAGO_EVENT" == pull_request ]]; then
          policy_root="$GITHUB_WORKSPACE/.mago-ski-base"
        fi
        # The verifier runs from this action's own checkout (pinned by the caller's `uses:` ref),
        # never from code in the repository under review.
        node "$MAGO_ACTION_PATH/hosts/github/run.ts" "$policy_root" "$GITHUB_WORKSPACE" "$MAGO_POLICY"
