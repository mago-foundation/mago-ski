name: mago-ski tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          check-latest: false
      - name: Check action and workflow policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          action = Path('action.yml').read_text()
          workflow = Path('.github/workflows/test.yml').read_text()
          uses = []
          for line in (action + workflow).splitlines():
              line = line.strip()
              if line.startswith('uses:'):
                  uses.append(line.split(None, 1)[1])
          assert uses
          for use in uses:
              _, separator, sha = use.rpartition('@')
              assert separator and len(sha) == 40
              assert all(char in '0123456789abcdef' for char in sha)
          permission_key = 'permission' + 's:'
          assert workflow.count(permission_key) == 1
          assert '  contents: read' in workflow
          assert 'npm test' in workflow
          assert action.count('github.event.pull_request.base.sha') == 2
          assert 'github.sha' not in action
          assert 'persist-credentials: false' in action
          assert 'cli="$base_root/bin/mago-ski.mjs"' in action
          assert 'trust_path="$base_root/$MAGO_TRUST_PATH"' in action
          assert 'approvals_path="$base_root/$MAGO_APPROVALS_PATH"' in action
          assert 'eval ' not in action
          forbidden = ['pull_request' + '_target', 'id' + '-token']
          assert all(value not in workflow for value in forbidden)
          assert all(value not in action for value in forbidden)
          assert 'secrets' + '.' not in workflow
          assert 'secrets' + '.' not in action
          assert "if: github.event_name == 'push'" in workflow
          assert 'Exercise protected-base verifier integration' in workflow
          print('Action/workflow trust-boundary assertions passed.')
          PY
      - name: Parse package sources without running Skills
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path ./node_modules -prune -o -type f -name '*.mjs' -print0)
      - name: Test the package
        run: npm test
      - name: Exercise protected-base verifier integration
        if: github.event_name == 'push'
        env:
          PROTECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync, execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import {
            copyFile, cp, mkdir, mkdtemp, readFile, rename, rm, writeFile,
          } from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const repo = process.cwd();
          const sha = process.env.PROTECTED_SHA ?? '';
          assert.match(sha, /^[0-9a-f]{40}$/u);
          assert.equal(
            execFileSync('git', ['rev-parse', 'HEAD'], { cwd: repo })
              .toString().trim(),
            sha,
          );
          const actionText = await readFile('action.yml', 'utf8');
          function actionRun(name) {
            const lines = actionText.split(/\r?\n/u);
            const step = lines.indexOf(`    - name: ${name}`);
            assert.notEqual(step, -1, `missing action step: ${name}`);
            const run = lines.indexOf('      run: |', step + 1);
            assert.notEqual(run, -1, `missing run block: ${name}`);
            let end = lines.findIndex((line, i) => i > run &&
              line.startsWith('    - name:'));
            if (end < 0) end = lines.length;
            return lines.slice(run + 1, end).map(line =>
              line.startsWith('        ') ? line.slice(8) : line,
            ).join('\n');
          }
          const preflight = actionRun('Validate event and protected revision');
          const verify = actionRun('Verify candidate bytes and exact approval');
          function shell(script, env) {
            return spawnSync('bash', ['-c', script], {
              encoding: 'utf8', timeout: 30000,
              env: { ...process.env, ...env },
            });
          }
          const temp = await mkdtemp(
            path.join(os.tmpdir(), 'mago-ski-action-'),
          );
          try {
            for (const event of ['push', 'workflow_dispatch',
              ['pull_request', '_target'].join('')]) {
              const root = path.join(
                temp, `event-${event.replaceAll('/', '-')}`,
              );
              await mkdir(root);
              const result = shell(preflight, {
                GITHUB_EVENT_NAME: event, GITHUB_WORKSPACE: root,
                MAGO_BASE_SHA: sha,
              });
              assert.equal(result.status, 2, `event accepted: ${event}`);
            }
            const missingShaRoot = path.join(temp, 'missing-sha');
            await mkdir(missingShaRoot);
            assert.equal(shell(preflight, {
              GITHUB_EVENT_NAME: 'pull_request',
              GITHUB_WORKSPACE: missingShaRoot, MAGO_BASE_SHA: '',
            }).status, 2);
            const okRoot = path.join(temp, 'preflight-ok');
            await mkdir(okRoot);
            assert.equal(shell(preflight, {
              GITHUB_EVENT_NAME: 'pull_request',
              GITHUB_WORKSPACE: okRoot, MAGO_BASE_SHA: sha,
            }).status, 0);

            const workspace = path.join(temp, 'workspace');
            const base = path.join(workspace, '.mago-ski-base');
            const basePackage = base;
            const policy = path.join(base, 'policy');
            const skill = path.join(workspace, 'skills', 'demo');
            const keys = path.join(temp, 'keys');
            const candidatePolicy = path.join(workspace, 'candidate-policy');
            const fakeAction = path.join(workspace, 'candidate-action');
            await Promise.all([
              mkdir(basePackage, { recursive: true }),
              mkdir(policy, { recursive: true }),
              mkdir(skill, { recursive: true }),
              mkdir(keys, { recursive: true }),
              mkdir(candidatePolicy, { recursive: true }),
              mkdir(path.join(fakeAction, 'bin'), { recursive: true }),
            ]);
            await cp('bin', path.join(basePackage, 'bin'),
              { recursive: true });
            await cp('src', path.join(basePackage, 'src'),
              { recursive: true });
            const cli = path.join(basePackage, 'bin', 'mago-ski.mjs');
            const marker = path.join(temp, 'candidate-verifier-ran');
            await writeFile(path.join(fakeAction, 'bin', 'mago-ski.mjs'),
              "import { writeFileSync } from 'node:fs';\n" +
              "writeFileSync(process.env.FAKE_VERIFIER_MARKER, 'ran');\n");
            const core = await import(pathToFileURL(
              path.join(basePackage, 'src', 'index.mjs'),
            ).href);
            function coreCli(args, expected = 0) {
              const result = spawnSync(process.execPath, [cli, ...args], {
                encoding: 'utf8', timeout: 30000,
              });
              assert.equal(result.status, expected,
                `core CLI exit ${result.status}: ${result.stderr}`);
              return result.stdout.trim()
                ? JSON.parse(result.stdout.trim()) : null;
            }
            const original = '# Test Skill\nRead-only fixture instructions.\n';
            const skillFile = path.join(skill, 'SKILL.md');
            await writeFile(skillFile, original);
            const trustedKey = await core.generateEd25519KeyPair(
              path.join(keys, 'trusted.pem'), path.join(keys, 'trusted.pub'),
            );
            const unknownKey = await core.generateEd25519KeyPair(
              path.join(keys, 'unknown.pem'), path.join(keys, 'unknown.pub'),
            );
            const manifestPath = path.join(workspace, 'manifest.json');
            const signaturePath = path.join(workspace, 'signature.json');
            const trustPath = path.join(policy, 'trust.json');
            const approvalsPath = path.join(policy, 'approvals.json');
            await core.writeNewCanonicalFile(trustPath, {
              trust_version: core.TRUST_VERSION,
              ed25519: [core.makeEd25519TrustEntry(
                trustedKey.keyId, Buffer.from(trustedKey.publicKey, 'base64'),
              )],
              sigstore: [],
            });
            const initial = coreCli([
              'init', '--skill', skill, '--manifest', manifestPath,
              '--name', 'demo-skill',
            ]);
            const initialManifest = JSON.parse(
              await readFile(manifestPath, 'utf8'),
            );
            await core.writeNewCanonicalFile(approvalsPath, {
              approval_version: core.APPROVAL_VERSION,
              approvals: [{
                skill_name: 'demo-skill',
                digest: initialManifest.tree_digest,
              }],
            });
            coreCli([
              'sign', '--skill', skill, '--manifest', manifestPath,
              '--profile', 'ed25519', '--signature', signaturePath,
              '--private-key', trustedKey.privateKeyPath,
            ]);
            function verifyEnv(overrides = {}) {
              return {
                GITHUB_WORKSPACE: workspace,
                GITHUB_ACTION_PATH: fakeAction,
                MAGO_BASE_SHA: sha,
                MAGO_SKILL_PATH: 'skills/demo',
                MAGO_MANIFEST_PATH: 'manifest.json',
                MAGO_SIGNATURE_PATH: 'signature.json',
                MAGO_PROFILE: 'ed25519',
                MAGO_TRUST_PATH: 'policy/trust.json',
                MAGO_APPROVALS_PATH: 'policy/approvals.json',
                MAGO_IDENTITY: '', MAGO_ISSUER: '', MAGO_COSIGN_PATH: '',
                FAKE_VERIFIER_MARKER: marker,
                ...overrides,
              };
            }
            function verifyCandidate(overrides = {}) {
              return shell(verify, verifyEnv(overrides));
            }
            const accepted = verifyCandidate();
            assert.equal(accepted.status, 0, accepted.stderr);
            assert.equal(
              JSON.parse(accepted.stdout).status, 'VERIFIED_APPROVED',
            );
            assert.equal(existsSync(marker), false,
              'candidate verifier executed');

            const savedCli = `${cli}.saved`;
            await rename(cli, savedCli);
            try {
              const absent = verifyCandidate();
              assert.equal(absent.status, 2);
              assert.match(absent.stderr, /protected-base mago-ski verifier/u);
              assert.equal(existsSync(marker), false);
            } finally {
              await rename(savedCli, cli);
            }
            const escaped = verifyCandidate({ MAGO_SKILL_PATH: '../outside' });
            assert.equal(escaped.status, 2);
            const escapedTrust = verifyCandidate({
              MAGO_TRUST_PATH: '../candidate-policy/approvals.json',
            });
            assert.equal(escapedTrust.status, 2);

            await writeFile(skillFile, `${original}Changed bytes.\n`);
            const added = path.join(skill, 'added.md');
            await writeFile(added, 'Added candidate data.\n');
            const stale = verifyCandidate();
            assert.equal(stale.status, 2);
            assert.match(stale.stderr, /Manifest digest does not match/u);
            const changedManifestPath = path.join(workspace, 'changed.json');
            const changedSignaturePath = path.join(
              workspace, 'changed.sig.json',
            );
            coreCli([
              'init', '--skill', skill, '--manifest', changedManifestPath,
              '--name', 'demo-skill',
            ]);
            const changedManifest = JSON.parse(
              await readFile(changedManifestPath, 'utf8'),
            );
            coreCli([
              'sign', '--skill', skill, '--manifest', changedManifestPath,
              '--profile', 'ed25519', '--signature', changedSignaturePath,
              '--private-key', trustedKey.privateKeyPath,
            ]);
            await core.writeNewCanonicalFile(
              path.join(candidatePolicy, 'approvals.json'), {
                approval_version: core.APPROVAL_VERSION,
                approvals: [{ skill_name: 'demo-skill',
                  digest: changedManifest.tree_digest }],
              },
            );
            const unapproved = verifyCandidate({
              MAGO_MANIFEST_PATH: 'changed.json',
              MAGO_SIGNATURE_PATH: 'changed.sig.json',
            });
            assert.equal(unapproved.status, 1, unapproved.stderr);
            assert.equal(JSON.parse(unapproved.stdout).status,
              'VERIFIED_UNAPPROVED');
            assert.equal(JSON.parse(await readFile(path.join(candidatePolicy,
              'approvals.json'), 'utf8')).approvals[0].digest,
              changedManifest.tree_digest);
            assert.equal(JSON.parse(await readFile(approvalsPath, 'utf8'))
              .approvals[0].digest, initialManifest.tree_digest);

            await writeFile(skillFile, original);
            await rm(added);
            const unknownSignature = path.join(workspace, 'unknown.sig.json');
            coreCli([
              'sign', '--skill', skill, '--manifest', manifestPath,
              '--profile', 'ed25519', '--signature', unknownSignature,
              '--private-key', unknownKey.privateKeyPath,
            ]);
            const unknown = verifyCandidate({
              MAGO_SIGNATURE_PATH: 'unknown.sig.json',
            });
            assert.equal(unknown.status, 1, unknown.stderr);
            assert.equal(JSON.parse(unknown.stdout).status, 'REJECTED');

            const rootFixture = path.join(repo,
              'tests/fixtures/cosign-trusted-root.json');
            await copyFile(rootFixture, path.join(policy, 'trusted-root.json'));
            const identity = 'phase2-test@example.invalid';
            const issuer = 'https://issuer.example.invalid';
            const sigstoreTrust = {
              trust_version: core.TRUST_VERSION,
              ed25519: [],
              sigstore: [{ certificate_identity: identity,
                certificate_oidc_issuer: issuer,
                trusted_root: 'trusted-root.json' }],
            };
            const sigstoreTrustPath = path.join(policy, 'sigstore-trust.json');
            await core.writeNewCanonicalFile(sigstoreTrustPath, sigstoreTrust);
            const missingRootTrustPath = path.join(policy, 'missing-root.json');
            await core.writeNewCanonicalFile(missingRootTrustPath, {
              ...sigstoreTrust,
              sigstore: [{ ...sigstoreTrust.sigstore[0],
                trusted_root: 'absent-root.json' }],
            });
            const bundlePath = path.join(workspace, 'fixture.bundle');
            await writeFile(bundlePath, '{}\n');
            const sigstoreEnv = {
              MAGO_PROFILE: 'sigstore',
              MAGO_TRUST_PATH: 'policy/sigstore-trust.json',
              MAGO_IDENTITY: identity,
              MAGO_ISSUER: issuer,
              MAGO_COSIGN_PATH: path.join(temp, 'missing-cosign'),
              MAGO_SIGNATURE_PATH: 'fixture.bundle',
            };
            const noTool = verifyCandidate({ ...sigstoreEnv,
              MAGO_COSIGN_PATH: '' });
            assert.equal(noTool.status, 2);
            assert.ok(noTool.stderr.includes('Cosign v3.1.3'));
            const noBundle = verifyCandidate({ ...sigstoreEnv,
              MAGO_SIGNATURE_PATH: 'missing.bundle' });
            assert.equal(noBundle.status, 2);
            assert.match(noBundle.stderr, /Signature path does not exist/u);
            const noTrust = verifyCandidate({ ...sigstoreEnv,
              MAGO_TRUST_PATH: 'policy/missing-trust.json' });
            assert.equal(noTrust.status, 2);
            assert.match(noTrust.stderr, /Trust path does not exist/u);
            const noRoot = verifyCandidate({ ...sigstoreEnv,
              MAGO_TRUST_PATH: 'policy/missing-root.json' });
            assert.equal(noRoot.status, 2);
            assert.ok(noRoot.stderr.includes('absent-root.json'));
            const noCosign = verifyCandidate(sigstoreEnv);
            assert.equal(noCosign.status, 2);
            assert.ok(noCosign.stderr || noCosign.stdout);

            console.log('Action integration passed: all trust-boundary cases.');
          } finally {
            await rm(temp, { recursive: true, force: true });
          }
          NODE
