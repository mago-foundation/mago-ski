name: sast

# Static analysis on every pull request and push to dev and main:
# - CodeQL: data flow across files, for the TypeScript sources and for the GitHub Actions workflows and action.yml.
# - Semgrep: mago-ski's own invariants (.semgrep.yml) and the community TypeScript, Node.js and Actions rules.
# - zizmor: GitHub Actions security (injection, credentials, caches, pinning).
# Semgrep and zizmor fail the check on any finding. CodeQL reports to the repository's code scanning alerts.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed # 1.184.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        run: |
          set -eu
          # The checkout belongs to another user than the container's; Semgrep lists the tracked files with git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan \
            --config .semgrep.yml \
            --config p/typescript \
            --config p/nodejs \
            --config p/github-actions \
            --error \
            --metrics=off \
            --timeout 60

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Fail the check on findings, instead of only uploading them to code scanning.
          advanced-security: false
