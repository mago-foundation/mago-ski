# Publishes mago-ski to npm when a version tag (v1.2.3) is pushed on main.
#
# One-time setup (outside this file):
# - npmjs.com → mago-ski → Settings → Trusted publishing: add GitHub Actions publisher
#   mago-foundation/mago-ski, workflow file release.yml, environment release.
#   Publishing then uses short-lived OIDC credentials; no NPM_TOKEN secret exists anywhere.
# - GitHub → Settings → Environments: create "release" with required reviewers (the release owner).
#
# The tarball is built and checked once, in a job with no publish rights, and the reviewed
# environment publishes exactly that file.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - name: Check the tag is on main and matches package.json
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Type-check and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="$(npm pack --ignore-scripts --pack-destination release | tail -n 1)"
          sha256="$(sha256sum "release/$tarball" | cut -d' ' -f1)"
          echo "$sha256  $tarball" > release/SHA256SUMS
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "### mago-ski $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tarball\` sha256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the packed command
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp "release/${{ steps.pack.outputs.tarball }}" "$dir/"
          cd "$dir"
          npm init -y > /dev/null
          npm install --ignore-scripts "./${{ steps.pack.outputs.tarball }}"
          npx --no-install mago-ski --version | grep -Fx "mago-ski ${{ steps.meta.outputs.version }}"
          npx --no-install mago-ski --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify the tarball is the one that was built and tested
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          [[ "$(sha256sum '${{ needs.build.outputs.tarball }}' | cut -d' ' -f1)" == "${{ needs.build.outputs.sha256 }}" ]]

      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1+)`);
              process.exit(1);
            }' "$npm_version"

      - name: Publish to npm with provenance
        run: npm publish "release/${{ needs.build.outputs.tarball }}" --provenance --access public

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          notes="Published to npm with provenance: https://www.npmjs.com/package/mago-ski/v/${TAG#v}

          Tarball: \`$TARBALL\`
          SHA-256: \`$SHA256\`

          Verify the provenance after installing: \`npm audit signatures\`"
          gh release create "$TAG" "release/$TARBALL" release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "mago-ski $TAG" --notes "$notes" --generate-notes --verify-tag
