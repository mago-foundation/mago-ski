# Publishes mago-ski to npm when a version tag (v1.2.3) is pushed on main.
#
# One-time setup (outside this file):
# - GitHub → Settings → Environments: create "release" with required reviewers (the release owner).
# - First release only: npm lets you configure trusted publishing only for a package that already
#   exists. For that release, store a short-lived npm granular access token (read and write,
#   expiring in a day) as the secret NPM_TOKEN on the "release" environment (not a repository secret).
# - After the first release: npmjs.com → mago-ski → Settings → Trusted publishing: add GitHub Actions
#   publisher mago-foundation/mago-ski, workflow release.yml, environment release. Then delete the
#   NPM_TOKEN secret and revoke the token. From then on npm uses short-lived OIDC credentials and no
#   long-lived token exists anywhere. Provenance is attached either way (id-token: write).
#
# The tarball is built and checked once, in a job with no publish rights, and the reviewed
# environment publishes exactly that file.
name: release

on:
  push:
    tags: ['v*.*.*']
  # Re-run a release for an existing tag with the workflow file from main (for example after a
  # workflow fix), without moving the tag. Publishing still needs approval of the release environment.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Validate the tag name
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got: $RELEASE_TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - name: Check the tag is on main and matches package.json
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          # fetch-depth: 0 already fetched every branch; no further fetch is needed (and with
          # persist-credentials: false a fetch from a private repo has no credentials).
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$commit" ]]; then
            echo "::error::Checked-out commit does not match tag $tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $tag points to a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Type-check and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="$(npm pack --ignore-scripts --pack-destination release | tail -n 1)"
          sha256="$(sha256sum "release/$tarball" | cut -d' ' -f1)"
          echo "$sha256  $tarball" > release/SHA256SUMS
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "### mago-ski $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tarball\` sha256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the packed command
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp "release/${{ steps.pack.outputs.tarball }}" "$dir/"
          cd "$dir"
          npm init -y > /dev/null
          npm install --ignore-scripts "./${{ steps.pack.outputs.tarball }}"
          npx --no-install mago-ski --version | grep -Fx "mago-ski ${{ steps.meta.outputs.version }}"
          npx --no-install mago-ski --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify the tarball is the one that was built and tested
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          [[ "$(sha256sum '${{ needs.build.outputs.tarball }}' | cut -d' ' -f1)" == "${{ needs.build.outputs.sha256 }}" ]]

      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1+)`);
              process.exit(1);
            }' "$npm_version"

      - name: Check there is a way to authenticate
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]] && ! npm view mago-ski version > /dev/null 2>&1; then
            echo "::error::mago-ski is not on npm yet, so trusted publishing cannot be used. For the first release, add a short-lived npm token as the secret NPM_TOKEN on the 'release' environment (Settings → Environments → release), not as a repository secret."
            exit 1
          fi

      - name: Publish to npm with provenance
        # npm tries trusted publishing (OIDC) first. NPM_TOKEN is only for the first release, before
        # trusted publishing can be configured; leave it unset afterwards.
        # The ./ matters: npm reads "dir/file.tgz" without it as a GitHub "user/repo" shorthand.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./release/${{ needs.build.outputs.tarball }}" --provenance --access public

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          notes="Published to npm with provenance: https://www.npmjs.com/package/mago-ski/v/${TAG#v}

          Tarball: \`$TARBALL\`
          SHA-256: \`$SHA256\`

          Verify the provenance after installing: \`npm audit signatures\`"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release written by hand is kept as it is; only the published files are attached.
            gh release upload "$TAG" "release/$TARBALL" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "release/$TARBALL" release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "mago-ski $TAG" --notes "$notes" --generate-notes --verify-tag
          fi
