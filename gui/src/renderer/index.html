<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>mago-ski</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">mago <span>/ ski</span></div>
    <div class="tagline" data-i18n="page.tagline"></div>
    <div class="chip" data-i18n="page.chip"></div>
    <div class="spacer"></div>
    <div class="seg lang-switch" role="group" data-i18n-aria="lang.switch">
      <button type="button" data-lang="ko" lang="ko" aria-pressed="false">한국어</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </div>
    <div class="status" id="status"><span class="dot"></span><span data-i18n="header.starting"></span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="skills" aria-selected="true"><span data-i18n="tab.skills"></span> <span class="count" id="count">0</span></button>
    <button class="tab" role="tab" data-tab="activity" aria-selected="false" data-i18n="tab.activity"></button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false" data-i18n="tab.settings"></button>
    <button class="tab" role="tab" data-tab="admin" aria-selected="false" data-i18n="tab.admin"></button>
  </nav>

  <main>
    <section id="tab-skills">
      <section class="headline">
        <div>
          <h1 id="headline" data-i18n="page.headlineInitial"></h1>
          <p id="subline" data-i18n="page.subline"></p>
        </div>
        <div class="spacer"></div>
        <button class="btn" id="check-now" data-i18n="page.checkNow"></button>
      </section>
      <div id="banners"></div>
      <section class="rack-wrap" data-i18n-aria="page.chainAria">
        <div class="rack-head">
          SKILL CHAIN / AUTO RACKED
          <div class="spacer"></div>
          <div class="legend">
            <span><i class="live"></i><span data-i18n="page.legendLive"></span></span>
            <span><i class="concept"></i><span data-i18n="page.legendConcept"></span></span>
          </div>
        </div>
        <div class="chain" id="chain"></div>
      </section>
      <section class="detail" id="detail"></section>
    </section>

    <section id="tab-activity" class="page" hidden></section>
    <section id="tab-settings" class="page" hidden></section>
    <section id="tab-admin" class="page" hidden></section>
  </main>

  <footer class="foot">
    <span data-i18n="page.footLeft"></span>
    <span id="foot-right" data-i18n="page.footRight"></span>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
